[[repos]]
hooks = [{ id = "ruff-check" }, { id = "ruff-format" }]
repo = "https://github.com/charliermarsh/ruff-pre-commit"
rev = "v0.17.4"

[[repos]]
hooks = [{ id = "codespell", args = ["--skip=node_modules"] }]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos]]
hooks = [{ id = "taplo-format" }]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"

[[repos]]
hooks = [{ id = "basedpyright", language = "system" }]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.40.2"

[[repos]]
hooks = [
  { id = "check-added-large-files" },
  { id = "check-ast" },
  { id = "check-builtin-literals" },
  { id = "check-case-conflict" },
  { id = "check-docstring-first" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "debug-statements" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "trailing-whitespace" },
]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
args = ["--unique"]
files = "^.vale/"
id = "file-contents-sorter"

[[repos]]
hooks = [{ id = "sync-with-uv" }]
repo = "https://github.com/tsvikas/sync-with-uv"
rev = "v0.6.0"

[[repos]]
repo = "local"

[[repos.hooks]]
entry = "vale"
files = "\\.(md|rst|txt|adoc)$"
id = "vale"
language = "system"
name = "vale"

[[repos.hooks]]
entry = "npm exec --no -- prettier --write"
files = "\\.(md|json|yaml|yml)$"
id = "prettier"
language = "system"
name = "prettier"
