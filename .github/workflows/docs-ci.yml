name: Docs CI
on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
permissions:
  contents: read
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/vale-cli/vale/releases/latest \
            --jq '.assets[] | select(.name | endswith("_Linux_64-bit.tar.gz")) | .browser_download_url')
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - name: Sync Vale styles
        run: |
          attempt=0
          until vale sync; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Lint documentation
        run: vale README.md CONTRIBUTING.md
