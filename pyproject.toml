[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs>=0.5", "hatchling>=1.33.0"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []
description = "Cute URLs for ugly IDs. A fast, stateless, reversible, profanity-free integer obfuscation library for Python."
dynamic = ["version"]
keywords = ["python", "yurli"]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
name = "yurli"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
coverage = ["coverage[toml]==7.17.2", { include-group = "test" }]
dev = [
  "build==1.6.1",
  { include-group = "coverage" },
  { include-group = "format" },
  { include-group = "prek" },
  { include-group = "spell" },
  { include-group = "types" },
]
format = [
  "taplo==0.9.3",
  { include-group = "lint" },
  { include-group = "prek" },
]
lint = ["ruff==0.17.4"]
prek = ["prek==0.5.10"]
spell = ["codespell==2.4.3"]
test = ["pytest==9.2.0"]
types = ["basedpyright==1.40.2", { include-group = "test" }]

[tool.basedpyright]
include = ["tests", "yurli"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# Checked by ruff
reportPrivateUsage = "none"

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.coverage.run]
branch = true
source = ["yurli"]

[tool.sync-with-uv.repo-to-package]
"https://github.com/DetachHead/basedpyright-prek-mirror" = "basedpyright"

[tool.pytest.ini_options]
addopts = ["--durations=10", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "incorrect-blank-line-before-class",
  "missing-copyright-notice",
  "undocumented-public-package",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"!**/conftest.py" = ["pytest-fixture-autouse"]
"tests/**/*.py" = [
  "assert",
  "boolean-type-hint-positional-argument",
  "import-private-name",
  "magic-value-comparison",
  "private-member-access",
  "suspicious-non-cryptographic-random-usage",
  "suspicious-subprocess-import",
  "too-many-arguments",
  "too-many-positional-arguments",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-nested-class",
  "unused-function-argument",
]

[tool.hatch.version]
fallback-version = "0.1.0"
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "yurli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["yurli"]

[tool.hatch.build.targets.wheel.force-include]
"yurli/blocklist.txt" = "yurli/blocklist.txt"
