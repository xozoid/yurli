[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.33.0", "hatch-vcs>=0.5"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []
description = "A Python project."
keywords = ["python"]
license = "MIT"
license-files = ["LICENSE"]
name = "new-project"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]

[dependency-groups]
lint = ["ruff==0.17.4"]
spell = ["codespell==2.4.3"]
test = ["pytest==9.2.0"]
coverage = ["coverage[toml]==7.17.2", { include-group = "test" }]
types = ["basedpyright==1.40.2"]
prek = ["prek==0.5.10"]
format = [
  "taplo==0.9.3",
  { include-group = "lint" },
  { include-group = "prek" },
]
dev = [
  "build==1.6.1",
  { include-group = "coverage" },
  { include-group = "format" },
  { include-group = "prek" },
  { include-group = "spell" },
  { include-group = "types" },
]

[tool.basedpyright]
include = ["new_project", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true

[tool.coverage.run]
branch = true
source = ["new_project"]

[tool.sync-with-uv.repo-to-package]
"https://github.com/DetachHead/basedpyright-prek-mirror" = "basedpyright"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "incorrect-blank-line-before-class",
  "missing-copyright-notice",
  "missing-trailing-comma",            # ruff format adds trailing commas
  "undocumented-public-package",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!**/conftest.py" = ["pytest-fixture-autouse"]
"tests/**/*.py" = [
  "assert",
  "boolean-type-hint-positional-argument",
  "import-private-name",
  "magic-value-comparison",
  "private-member-access",
  "suspicious-non-cryptographic-random-usage",
  "suspicious-subprocess-import",
  "too-many-arguments",
  "too-many-positional-arguments",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-nested-class",
  "unused-function-argument",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["new_project"]
